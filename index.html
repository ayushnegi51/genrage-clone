<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genrage - Official Store</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .announcement-bar {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-size: 11px;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: #121212;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }
        .section-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 0;
            color: #aaa;
        }
        .shop-grid {
            display: flex;
            justify-content: center;
        }
        .product-card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            position: relative;
            padding-bottom: 15px;
            width: 100%;
            max-width: 320px;
            border-radius: 4px;
            overflow: hidden;
        }
        .sale-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #e53935;
            color: #fff;
            font-size: 10px;
            padding: 4px 6px;
            font-weight: bold;
            z-index: 2;
        }
        .product-image {
            width: 100%;
            height: 380px;
            object-fit: cover;
            background: #222;
            display: block;
        }
        .product-info {
            padding: 15px;
            text-align: center;
        }
        .product-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .product-price {
            font-size: 14px;
            font-weight: bold;
            color: #ff5252;
            margin-bottom: 12px;
        }
        .old-price {
            text-decoration: line-through;
            color: #777;
            font-size: 11px;
            margin-left: 6px;
        }
        .buy-btn {
            display: block;
            width: 100%;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .buy-btn:hover {
            background: #e0e0e0;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
        }
        .modal-content {
            background-color: #1a1a1a;
            margin: 25% auto;
            padding: 20px;
            border: 1px solid #333;
            width: 85%;
            max-width: 300px;
            text-align: center;
            border-radius: 8px;
        }
        .modal-content img {
            width: 180px;
            height: 180px;
            margin: 15px 0;
            background: #fff;
            padding: 5px;
        }
        .close-btn {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="announcement-bar">
        FREE DOORSTEP DELIVERY IN INDIA 🇮🇳 | WEEKEND SAVINGS 50% OFF - ONLY TODAY
    </div>

    <header>
        <div class="logo">GENRAGE</div>
        <div>🛒</div>
    </header>

    <div class="container">
        <div class="section-title">All Products</div>
        <div class="shop-grid">

            <!-- Single Target Product -->
            <div class="product-card">
                <span class="sale-badge">SAVE 50%</span>
                <img src="https://images.unsplash.com/photo-1517445312882-bc9910d016b7?w=600" class="product-image" alt="Genrage Black Balloon Pants">
                <div class="product-info">
                    <div class="product-title">GENRAGE BLACK BALLOON PANTS</div>
                    <div class="product-price">Rs. 1,500 <span class="old-price">Rs. 2,999</span></div>
                    <button class="buy-btn" onclick="openScanner()">Add to Cart</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Scanner Modal Popup -->
    <div id="scannerModal" class="modal">
        <div class="modal-content">
            <h3 style="font-size: 15px;">Scan to Pay</h3>
            <img src="scanner.png" alt="PhonePe QR Code">
            <p style="font-size: 11px; color: #aaa;">Scan using any UPI app to place order.</p>
            <button class="close-btn" onclick="closeScanner()">Cancel</button>
        </div>
    </div>

    <script>
        function openScanner() {
            document.getElementById('scannerModal').style.display = 'block';
        }
        function closeScanner() {
            document.getElementById('scannerModal').style.display = 'none';
        }
    </script>
</body>
</html>
